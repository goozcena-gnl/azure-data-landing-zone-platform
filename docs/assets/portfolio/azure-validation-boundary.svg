<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Azure landing zone architecture and validation boundary</title>
  <desc id="desc">The foundation lifecycle is validated; AKS, JupyterHub, and GitHub OIDC are implemented or prepared but not runtime validated.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0b2034"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#38bdf8"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#4ade80"/></marker></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="58" y="64" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="800">AZURE LANDING ZONE · ARCHITECTURE &amp; EVIDENCE</text>
  <text x="58" y="94" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Status is encoded explicitly; architecture does not imply runtime validation.</text>
  <rect x="48" y="126" width="680" height="436" rx="22" fill="#071d24" stroke="#4ade80" stroke-width="3"/>
  <rect x="70" y="146" width="225" height="34" rx="17" fill="#14532d"/><circle cx="91" cy="163" r="7" fill="#4ade80"/><text x="109" y="169" fill="#dcfce7" font-family="Arial, sans-serif" font-size="15" font-weight="800">VALIDATED FOUNDATION</text>
  <text x="70" y="211" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" font-weight="700">Terraform foundation</text>
  <path d="M250 204h62" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="326" y="185" width="162" height="54" rx="12" fill="#102b3d" stroke="#38bdf8"/><text x="407" y="218" fill="#e0f2fe">RESOURCE GROUPS</text>
    <rect x="508" y="185" width="180" height="54" rx="12" fill="#102b3d" stroke="#38bdf8"/><text x="598" y="218" fill="#e0f2fe">VNET + NSGS</text>
    <rect x="70" y="264" width="190" height="62" rx="12" fill="#102b3d" stroke="#38bdf8"/><text x="165" y="291" fill="#e0f2fe">GOVERNANCE</text><text x="165" y="312" fill="#7dd3fc" font-size="13">location + tags</text>
    <rect x="280" y="264" width="190" height="62" rx="12" fill="#102b3d" stroke="#38bdf8"/><text x="375" y="291" fill="#e0f2fe">LOG ANALYTICS</text><text x="375" y="312" fill="#7dd3fc" font-size="13">quota + retention</text>
    <rect x="490" y="264" width="198" height="62" rx="12" fill="#102b3d" stroke="#38bdf8"/><text x="589" y="291" fill="#e0f2fe">SECURE STATE</text><text x="589" y="312" fill="#7dd3fc" font-size="13">Entra data plane</text>
  </g>
  <text x="70" y="373" fill="#86efac" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1">EMPIRICAL LIFECYCLE RECORD</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="14" font-weight="700">
    <rect x="70" y="395" width="98" height="48" rx="24" fill="#14532d"/><text x="119" y="425" fill="#dcfce7">DEPLOY</text>
    <rect x="196" y="395" width="104" height="48" rx="24" fill="#14532d"/><text x="248" y="425" fill="#dcfce7">SMOKE</text>
    <rect x="328" y="395" width="108" height="48" rx="24" fill="#14532d"/><text x="382" y="425" fill="#dcfce7">NO DRIFT</text>
    <rect x="464" y="395" width="104" height="48" rx="24" fill="#14532d"/><text x="516" y="425" fill="#dcfce7">DESTROY</text>
    <rect x="596" y="395" width="104" height="48" rx="24" fill="#14532d"/><text x="648" y="416" fill="#dcfce7">RESIDUAL</text><text x="648" y="432" fill="#dcfce7" font-size="11">CHECK</text>
  </g>
  <path d="M168 419h28M300 419h28M436 419h28M568 419h28" stroke="#4ade80" stroke-width="3" marker-end="url(#green)"/>
  <text x="70" y="489" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Deployed · smoke-tested · inventory-checked · destroyed · residual-checked</text>
  <rect x="754" y="126" width="398" height="436" rx="22" fill="#241b0b" fill-opacity=".55" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="776" y="146" width="316" height="34" rx="17" fill="#713f12"/><circle cx="797" cy="163" r="7" fill="#fbbf24"/><text x="815" y="169" fill="#fef3c7" font-family="Arial, sans-serif" font-size="14" font-weight="800">IMPLEMENTED / NOT RUNTIME VALIDATED</text>
  <g font-family="Arial, sans-serif">
    <rect x="786" y="212" width="334" height="86" rx="16" fill="#2a241c" stroke="#d97706"/><text x="810" y="244" fill="#fde68a" font-size="20" font-weight="700">OPTIONAL AKS</text><text x="810" y="271" fill="#cbd5e1" font-size="14">implemented + static validation only</text>
    <rect x="786" y="320" width="334" height="86" rx="16" fill="#2a241c" stroke="#d97706"/><text x="810" y="352" fill="#fde68a" font-size="20" font-weight="700">JUPYTERHUB</text><text x="810" y="379" fill="#cbd5e1" font-size="14">version-pinned overlay · not deployed</text>
    <rect x="786" y="428" width="334" height="86" rx="16" fill="#2a241c" stroke="#d97706"/><text x="810" y="460" fill="#fde68a" font-size="20" font-weight="700">GITHUB OIDC</text><text x="810" y="487" fill="#cbd5e1" font-size="14">workflow prepared · credentials absent</text>
  </g>
  <text x="58" y="596" fill="#64748b" font-family="Arial, sans-serif" font-size="13">SOLID GREEN = RETAINED LIFECYCLE EVIDENCE     ·     DASHED AMBER = IMPLEMENTED OR PREPARED, UNVERIFIED</text>
</svg>
