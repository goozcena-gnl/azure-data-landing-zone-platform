name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.15.8
  TERRAFORM_SHA256: d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository linters
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --no-input \
            yamllint==1.38.0 \
            shellcheck-py==0.11.0.1

      - name: Install Markdown lint
        run: npm install --global markdownlint-cli@0.49.0

      - name: Repository lint
        run: bash ./scripts/lint.sh

      - name: Secret-pattern scan
        run: python3 scripts/secret-scan.py --root .

      - name: Documentation links
        run: python3 scripts/check-doc-links.py

      - name: Backend helper regression tests
        run: bash terraform_backend_setup/tests/regression.sh

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Terraform
        run: |
          archive="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl --proto '=https' --tlsv1.2 -fsSLo "${archive}" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${archive}"
          echo "${TERRAFORM_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "${archive}"
          sudo install -m 0755 terraform /usr/local/bin/terraform
          rm -f "${archive}" terraform

          terraform version

      - name: Provider-mocked Terraform input tests
        run: make terraform-test

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Initialize and validate components
        run: bash ./scripts/terraform-validate.sh

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93  # v6.2.2
        with:
          tflint_version: v0.63.1

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive

      - name: Checkov
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --no-input \
            checkov==3.3.8
          bash ./scripts/security-scan.sh
