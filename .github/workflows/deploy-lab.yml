name: Plan and deploy Azure lab

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed plan after environment approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-lab-state
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.15.8
  TERRAFORM_SHA256: d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  ARM_USE_OIDC: true

jobs:
  plan:
    runs-on: [self-hosted, linux, x64, azure-lab]
    environment: azure-lab-plan
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_name_prefix: ${{ vars.TF_VAR_NAME_PREFIX }}
      TF_VAR_location: ${{ vars.TF_VAR_LOCATION }}
      TF_VAR_owner_tag: ${{ vars.TF_VAR_OWNER_TAG }}
      TF_VAR_enable_aks: ${{ vars.TF_VAR_ENABLE_AKS }}
      TF_VAR_enable_jupyter: ${{ vars.TF_VAR_ENABLE_JUPYTER }}
      TF_VAR_aks_node_vm_size: ${{ vars.TF_VAR_AKS_NODE_VM_SIZE }}
      TF_VAR_aks_node_count: ${{ vars.TF_VAR_AKS_NODE_COUNT }}
      TF_VAR_aks_authorized_ip_ranges: ${{ vars.TF_VAR_AKS_AUTHORIZED_IP_RANGES }}
      TF_VAR_aks_admin_group_object_ids: ${{ vars.TF_VAR_AKS_ADMIN_GROUP_OBJECT_IDS }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login through OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install verified Terraform
        run: |
          archive="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl --proto '=https' --tlsv1.2 -fsSLo "${archive}" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${archive}"
          echo "${TERRAFORM_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "${archive}"
          sudo install -m 0755 terraform /usr/local/bin/terraform
          rm -f "${archive}" terraform

      - name: AKS configuration preflight
        if: vars.TF_VAR_ENABLE_AKS == 'true' || vars.TF_VAR_ENABLE_JUPYTER == 'true'
        run: bash ./scripts/aks-preflight.sh --check-ci

      - name: Terraform plan
        working-directory: infra/landing-zone
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="use_azuread_auth=true"
          terraform validate -no-color
          terraform plan -input=false -lock-timeout=5m -out=lab.tfplan
          terraform show -no-color lab.tfplan > lab-plan.txt
          sha256sum lab.tfplan > lab.tfplan.sha256
          printf '%s\n' "$GITHUB_SHA" > planned-commit.txt
          bash ../../scripts/ci-context-fingerprint.sh > planned-context.sha256

      - name: Upload sensitive reviewed plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            infra/landing-zone/lab.tfplan
            infra/landing-zone/lab.tfplan.sha256
            infra/landing-zone/lab-plan.txt
            infra/landing-zone/planned-commit.txt
            infra/landing-zone/planned-context.sha256
          retention-days: 1
          if-no-files-found: error

      - name: Remove local plan material
        if: always()
        run: |
          rm -rf infra/landing-zone/.terraform
          rm -f \
            infra/landing-zone/lab.tfplan \
            infra/landing-zone/lab.tfplan.sha256 \
            infra/landing-zone/lab-plan.txt \
            infra/landing-zone/planned-commit.txt \
            infra/landing-zone/planned-context.sha256

  apply:
    if: inputs.apply
    needs: plan
    runs-on: [self-hosted, linux, x64, azure-lab]
    environment: azure-lab-apply
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_name_prefix: ${{ vars.TF_VAR_NAME_PREFIX }}
      TF_VAR_location: ${{ vars.TF_VAR_LOCATION }}
      TF_VAR_owner_tag: ${{ vars.TF_VAR_OWNER_TAG }}
      TF_VAR_enable_aks: ${{ vars.TF_VAR_ENABLE_AKS }}
      TF_VAR_enable_jupyter: ${{ vars.TF_VAR_ENABLE_JUPYTER }}
      TF_VAR_aks_node_vm_size: ${{ vars.TF_VAR_AKS_NODE_VM_SIZE }}
      TF_VAR_aks_node_count: ${{ vars.TF_VAR_AKS_NODE_COUNT }}
      TF_VAR_aks_authorized_ip_ranges: ${{ vars.TF_VAR_AKS_AUTHORIZED_IP_RANGES }}
      TF_VAR_aks_admin_group_object_ids: ${{ vars.TF_VAR_AKS_ADMIN_GROUP_OBJECT_IDS }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login through OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install verified Terraform
        run: |
          archive="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl --proto '=https' --tlsv1.2 -fsSLo "${archive}" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${archive}"
          echo "${TERRAFORM_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "${archive}"
          sudo install -m 0755 terraform /usr/local/bin/terraform
          rm -f "${archive}" terraform

      - name: Download reviewed plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: terraform-plan-${{ github.run_id }}
          path: infra/landing-zone

      - name: Verify and apply exact plan
        working-directory: infra/landing-zone
        run: |
          test "$(cat planned-commit.txt)" = "$GITHUB_SHA"
          sha256sum -c lab.tfplan.sha256
          test "$(cat planned-context.sha256)" = "$(bash ../../scripts/ci-context-fingerprint.sh)"
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="use_azuread_auth=true"
          terraform apply -input=false -lock-timeout=5m lab.tfplan

      - name: Remove downloaded plan material
        if: always()
        run: |
          rm -rf infra/landing-zone/.terraform
          rm -f \
            infra/landing-zone/lab.tfplan \
            infra/landing-zone/lab.tfplan.sha256 \
            infra/landing-zone/lab-plan.txt \
            infra/landing-zone/planned-commit.txt \
            infra/landing-zone/planned-context.sha256
